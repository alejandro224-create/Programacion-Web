<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>
		Login
	</title>
	<link rel="stylesheet" type="text/css" href="public/css/style_login.css">
</head>
<body>
	<div>
		<h1>
			Sign Up
		</h1>
	</div>
	<div>
		<h4>
			Create your account
		</h4>
	</div>
	<div>
		<div>
			<img width="20" class="imagen-usuario" src="images/usuario.png">
			<input type="text" name="Full name">
		</div>
		<br>
		<div>
			<img width="20" class="imagen-usuario" src="images/sobre.png">
			<input type="text" name="Email">
		</div>
		<br>
		<div>
			<img width="20" class="imagen-usuario" src="images/bloquear-alt.png">
			<input type="text" name="Password">
		</div>
		<br>
	</div>
	<br>
	<div>
		<button>
			Create Account
		</button>
		<p>
			Already have an account?
		</p>
		<button>
			Login
		</button>
	</div>
</body>
</html>
